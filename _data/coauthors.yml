# Co-author links for the publications page.
#
# _layouts/bib.liquid looks an author up by lowercased surname, then matches the
# given name against `firstname`, and wraps the name in a link to `url`. An
# author with no entry here simply renders as plain text, so this file only
# needs the people who actually have a page worth linking to.
#
# This replaced the al-folio demo data, which listed Einstein's co-authors
# (Podolsky, Schrödinger, Planck …) and therefore never matched anyone in
# _bibliography/papers.bib — the linking feature did nothing.
#
# Only URLs that were checked and resolve are listed. To add someone, use their
# surname in lowercase as the key and include every form of the given name that
# appears in papers.bib.

"oh":
  - firstname: ["Beomseok", "B.", "B. S."]
    url: https://beomseokohme.github.io/

"rho":
  - firstname: ["Junsuk", "J.", "J. S."]
    url: https://photonics.postech.ac.kr/
