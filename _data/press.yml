# Outlet registry for the "Media coverage" block on the publications page.
#
# This file holds what is constant per outlet (display name, group, domain).
# Anything paper-specific — the article URL — goes in _bibliography/papers.bib.
# Same split as _data/venues.yml, where the bib entry carries `abbr` and this
# folder carries the colour and link.
#
# ---------------------------------------------------------------------------
# HOW TO ADD COVERAGE TO A PAPER
# ---------------------------------------------------------------------------
# 1. Make sure the outlet has an entry under `outlets:` below. Adding one is a
#    name, a group and a domain — there is no logo file to produce. Icons are
#    fetched at render time from Google's favicon service, which normalizes and
#    crops every site's mark to the same square:
#
#      https://www.google.com/s2/favicons?domain=<domain>&sz=128
#
#    Note this makes the page call google.com for each outlet, so visitors are
#    exposed to Google on page load. Omit `domain:` to drop the icon and let the
#    name stand alone — worth doing when Google has no real mark for a site and
#    falls back to a generic globe.
#
# 2. In _bibliography/papers.bib, add a `press` field to the entry:
#
#      press = {yna|https://www.yna.co.kr/view/AKR...;
#               donga|https://www.donga.com/news/...},
#
#    Format is `<slug>|<article url>`, entries separated by semicolons.
#    Line breaks inside the braces are fine. The slug must match a key under
#    `outlets:`; an unknown slug still renders (as plain text) so typos are
#    visible rather than silently dropped.
#
# Note: `%` is a comment character in BibTeX. If an article URL contains one,
# percent-encode it as %25 or the entry will be truncated at that point.

# Display groups, in order. `code` is what an outlet's `group:` refers to.
# `embed: true` renders each item as a player rather than a link.
groups:
  - code: en
    label: English
  - code: ko
    label: Korean
  - code: video
    label: Video
    embed: true

outlets:
  # --- English ---------------------------------------------------------------
  dongascience:
    name: DongA Science
    group: en
    domain: www.dongascience.com

  physorg:
    name: Phys.org
    group: en
    domain: phys.org

  eurekalert:
    name: EurekAlert!
    group: en
    domain: www.eurekalert.org

  # --- Korean ----------------------------------------------------------------
  yna:
    name: Yonhap News
    group: ko
    domain: www.yna.co.kr

  donga:
    name: The Dong-A Ilbo
    group: ko
    domain: www.donga.com

  khan:
    name: The Kyunghyang Shinmun
    group: ko
    domain: www.khan.co.kr

  ytnscience:
    name: YTN Science
    group: ko
    domain: science.ytn.co.kr

  newsis:
    name: Newsis
    group: ko
    domain: www.newsis.com

  kpinews:
    name: KPI News
    group: ko
    domain: kpinews.kr

  dgmbc:
    name: Daegu MBC
    group: ko
    domain: dgmbc.com

  tbc:
    name: TBC
    group: ko
    domain: www.tbc.co.kr

  joongdo:
    name: Joongdo Ilbo
    group: ko
    domain: www.joongdo.co.kr

  kipost:
    name: KIPOST
    group: ko
    domain: www.kipost.net

  newsworks:
    name: Newsworks
    group: ko
    domain: www.newsworks.co.kr

  kbmaeil:
    name: Kyongbuk Maeil
    group: ko
    # Google has no mark for this host and serves a generic globe, so no domain.

  kbsm:
    name: Gyeongbuk Shinmun
    group: ko
    domain: www.kbsm.net

  hidomin:
    name: Gyeongbuk Domin Ilbo
    group: ko
    domain: www.hidomin.com

  kyongbuk:
    name: Kyongbuk Ilbo
    group: ko
    domain: www.kyongbuk.co.kr

  dkilbo:
    name: Daekyung Ilbo
    group: ko
    domain: www.dkilbo.com
    invert_dark: true # dark-on-transparent wordmark

  veritas:
    name: Veritas Alpha
    group: ko
    # A hairline "V" that washes out on both themes.

  unn:
    name: Korea University News
    group: ko
    domain: news.unn.net

  # --- Video (broadcast segments hosted on YouTube) ---------------------------
  ytnscience_yt:
    name: YTN Science
    group: video

  phmbc_yt:
    name: Pohang MBC
    group: video
