# Outlet registry for the "Media coverage" row on the publications page.
#
# This file holds everything that is the same for every article from an outlet
# (display name, logo, group). Anything paper-specific — i.e. the article URL —
# goes in _bibliography/papers.bib. Same split as _data/venues.yml, where the
# bib entry carries `abbr` and this folder carries the colour and link.
#
# ---------------------------------------------------------------------------
# HOW TO ADD COVERAGE TO A PAPER
# ---------------------------------------------------------------------------
# 1. Make sure the outlet has an entry under `outlets:` below. Add it if not.
#
# 2. Drop its logo in assets/img/press/ and point `logo:` at it. House style is
#    symbol marks, not wordmarks: take the outlet's apple-touch-icon or the
#    largest frame of its favicon, cap it at 64px tall, and set `symbol: true`
#    so the name renders beside it. Below ~32px, or when the mark is too faint
#    to read on both themes, leave `logo:` out — the name then stands alone.
#
# 3. In _bibliography/papers.bib, add a `press` field to the entry:
#
#      press = {yna|https://www.yna.co.kr/view/AKR...;
#               donga|https://www.donga.com/news/...},
#
#    Format is `<slug>|<article url>`, entries separated by semicolons.
#    Line breaks inside the braces are fine. The slug must match a key under
#    `outlets:`; an unknown slug still renders (as plain text) so typos are
#    visible rather than silently dropped.
#
# Note: `%` is a comment character in BibTeX. If an article URL contains one,
# percent-encode it as %25 or the entry will be truncated at that point.

# Display groups, in order. `code` is what an outlet's `group:` refers to.
groups:
  - code: en
    label: English
  - code: ko
    label: Korean
  - code: video
    label: Video

outlets:
