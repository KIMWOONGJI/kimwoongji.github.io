# Media outlet registry for the "Featured in" row on the publications page.
#
# This file holds everything that is the same for every article from an outlet
# (display name, logo, language). Anything paper-specific — i.e. the article URL
# — goes in _bibliography/papers.bib. Same split as _data/venues.yml, where the
# bib entry carries `abbr` and this folder carries the colour and link.
#
# ---------------------------------------------------------------------------
# HOW TO ADD PRESS COVERAGE TO A PAPER
# ---------------------------------------------------------------------------
# 1. Make sure the outlet has an entry under `outlets:` below. Add it if not.
#
# 2. Drop its logo in assets/img/press/ and point `logo:` at it.
#    Prefer SVG; PNG is fine. Aim for a transparent background and trim the
#    whitespace — the row renders them at a fixed height (see _sass/_base.scss).
#    No logo yet? Just omit `logo:` and the outlet name renders as text.
#
# 3. In _bibliography/papers.bib, add a `press` field to the entry:
#
#      press = {physorg|https://phys.org/news/2026-05-example.html;
#               yonhap|https://www.yna.co.kr/view/AKR20260512000000000},
#
#    Format is `<slug>|<article url>`, entries separated by semicolons.
#    Line breaks inside the braces are fine. The slug must match a key under
#    `outlets:`; an unknown slug still renders (as plain text) so typos are
#    visible rather than silently dropped.
#
# Note: `%` is a comment character in BibTeX. If an article URL contains one,
# percent-encode it as %25 or the entry will be truncated at that point.

# Language groups, in the order they are displayed. Remove a group or add one
# (e.g. `ja` / Japanese) and the layout follows automatically.
languages:
  - code: en
    label: English
  - code: ko
    label: Korean

outlets:
  # --- English ---------------------------------------------------------------
  dongascience:
    name: DongA Science
    lang: en
    logo: assets/img/press/dongascience.svg
    symbol: true # symbol mark, not a wordmark — render the name beside it

  physorg:
    name: Phys.org
    lang: en
    # logo: assets/img/press/physorg.svg

  eurekalert:
    name: EurekAlert!
    lang: en
    # logo: assets/img/press/eurekalert.svg

  sciencedaily:
    name: ScienceDaily
    lang: en
    # logo: assets/img/press/sciencedaily.svg

  # --- Korean ----------------------------------------------------------------
  yna:
    name: 연합뉴스
    lang: ko
    logo: assets/img/press/yna.png
    symbol: true

  donga:
    name: 동아일보
    lang: ko
    logo: assets/img/press/donga.png
    symbol: true

  khan:
    name: 경향신문
    lang: ko
    logo: assets/img/press/khan.png
    symbol: true

  newsis:
    name: 뉴시스
    lang: ko
    logo: assets/img/press/newsis.png
    symbol: true

  tbc:
    name: TBC
    lang: ko
    logo: assets/img/press/tbc.png
    symbol: true

  unn:
    name: 한국대학신문
    lang: ko
    # Only a 16px favicon is published — too small to render cleanly, so the
    # name stands alone until a usable mark turns up.

  kpinews:
    name: KPI뉴스
    lang: ko
    logo: assets/img/press/kpinews.png
    symbol: true

  hidomin:
    name: 경북도민일보
    lang: ko
    logo: assets/img/press/hidomin.png
    symbol: true

  kbmaeil:
    name: 경북매일
    lang: ko
    logo: assets/img/press/kbmaeil.png
    symbol: true

  kbsm:
    name: 경북신문
    lang: ko
    logo: assets/img/press/kbsm.png
    symbol: true

  dkilbo:
    name: 대경일보
    lang: ko
    logo: assets/img/press/dkilbo.png
    symbol: true
