<svg xmlns="http://www.w3.org/2000/svg" width="730" height="403" viewBox="0 0 730 403" role="img" aria-labelledby="title desc">
  <title id="title">TIT v3.1 measurement chain</title>
  <desc id="desc">Claude Code or Codex can help write MATLAB instrument drivers with the add-instrument skill. During measurement, tubebench drives the generator over SCPI and receives synchronized data from the HBK LAN-XI. Four microphone cables share a sleeve and fan out to four separate inputs.</desc>
